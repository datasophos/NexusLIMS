name: Reconcile documentation previews

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cloudflare-preview-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      # Only trusted default-branch code runs with the Cloudflare token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Remove closed PR previews
        env:
          CLOUDFLARE_PREVIEW_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloudflare_previews.py
